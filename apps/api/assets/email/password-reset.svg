<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- 3D padlock with a green reset badge. Rendered to PNG by scripts/build-email-icons.ts -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f8cfb"/>
      <stop offset="0.5" stop-color="#5b52ee"/>
      <stop offset="1" stop-color="#3d33c4"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2482"/>
      <stop offset="0.5" stop-color="#342d9e"/>
      <stop offset="1" stop-color="#221d6e"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8e97ab"/>
      <stop offset="0.3" stop-color="#f5f7fc"/>
      <stop offset="0.55" stop-color="#cdd3e0"/>
      <stop offset="0.8" stop-color="#eef1f7"/>
      <stop offset="1" stop-color="#7f889c"/>
    </linearGradient>
    <radialGradient id="hole" cx="0.5" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#2e2a7a"/>
      <stop offset="1" stop-color="#110e3f"/>
    </radialGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ee59a"/>
      <stop offset="1" stop-color="#0b9d6b"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="62" cy="118" rx="38" ry="5" fill="#1e1b4b" opacity="0.25" filter="url(#soft)"/>

  <!-- shackle: dark copy underneath gives depth, metal gradient on top -->
  <path d="M40 62V43a24 24 0 0 1 48 0v19" fill="none" stroke="#5d667a" stroke-width="13" stroke-linecap="round" transform="translate(1 2)"/>
  <path d="M40 62V43a24 24 0 0 1 48 0v19" fill="none" stroke="url(#metal)" stroke-width="11" stroke-linecap="round"/>
  <path d="M42.5 44a21.5 21.5 0 0 1 13-19.5" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="2.4" stroke-linecap="round"/>

  <!-- body: extruded base, gradient face, glossy top -->
  <rect x="24" y="60" width="80" height="56" rx="16" fill="url(#side)"/>
  <rect x="24" y="55" width="80" height="56" rx="16" fill="url(#body)"/>
  <rect x="29" y="58" width="70" height="22" rx="11" fill="url(#gloss)"/>
  <rect x="24.75" y="55.75" width="78.5" height="54.5" rx="15.25" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- keyhole -->
  <circle cx="64" cy="79" r="9" fill="url(#hole)"/>
  <path d="M60.2 83h7.6l2 13.2a2 2 0 0 1-2 2.3h-7.6a2 2 0 0 1-2-2.3z" fill="url(#hole)"/>
  <circle cx="61.4" cy="76.4" r="2.3" fill="#ffffff" opacity="0.35"/>

  <!-- reset badge -->
  <ellipse cx="99" cy="117" rx="15" ry="3.5" fill="#064e3b" opacity="0.3" filter="url(#soft)"/>
  <circle cx="98" cy="99" r="19.5" fill="#047857"/>
  <circle cx="98" cy="96.5" r="19.5" fill="url(#badge)" stroke="#ffffff" stroke-width="3.5"/>
  <ellipse cx="98" cy="87.5" rx="12" ry="5.5" fill="#ffffff" opacity="0.28"/>
  <path d="M106 96.5a8 8 0 1 1-2.34-5.66" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M106.6 86.4v5.6h-5.6" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
